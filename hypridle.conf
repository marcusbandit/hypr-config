# Lock after 10 idle minutes; never turn the screens off. hypridle only keeps
# time: loginctl asks logind, and banditshell's lock screen answers the Lock.
# Idle inhibitors hold it off: a playing video, any fullscreen window (the
# idle_inhibit rule in lua/rules.lua), `systemd-inhibit --what=idle`.

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
